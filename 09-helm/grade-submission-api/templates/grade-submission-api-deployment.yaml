apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.microservice.name }}
  namespace: {{ .Values.microservice.namespace }}
spec:
  replicas: {{ .Values.microservice.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Values.microservice.name }} ## specific instance of the application
  strategy:
    type: RollingUpdate ## default strategy type
    rollingUpdate:
      maxUnavailable: 50%
      maxSurge: 1 ## allows one additional pod during update
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grade-submission
        app.kubernetes.io/components: backend  ## component within the application
        app.kubernetes.io/instance: {{ .Values.microservice.name }}  ## specific instance of the application
    spec:
      containers:
      - name: {{ .Values.microservice.name }}
        image: {{ .Values.workload.image }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.workload.port }}
          initialDelaySeconds: {{ .Values.workload.livenessDelay }}
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: {{ .Values.workload.port }}
          # initialDelaySeconds: 10. ## Having initial delay may not be necessary if liveness probe is used
          periodSeconds: 5
        envFrom:
          - configMapRef: 
              name: {{ .Values.microservice.name }}-config
          - secretRef:
              name: {{ .Values.microservice.name }}-secret
        resources:
          requests:
            memory: {{ .Values.workload.resources.requests.memory }}
            cpu: {{ .Values.workload.resources.requests.cpu }}
          limits:
            memory: {{ .Values.workload.resources.limits.memory }}
        ports:
          - containerPort: {{ .Values.workload.port }}
