microservice:  ## General service details
  name: grade-submission-api
  namespace: grade-submission
  replicas: 2

workload: ## Workload specific configurations
  image: rslim087/kubernetes-course-grade-submission-api:stateless-v4
  port: 3000
  resources:
    requests:
      memory: "128Mi"
      cpu: "128m"
    limits:
      memory: "128Mi"
  livenessDelay: 15

secrets:
  MONGODB_URI: "mongodb://user:password1234@mongodb-grade-submission-svc.mongodb.svc.cluster.local:27017/grades" ## <service-name>.<service-namespace>.svc.cluster.local:27017