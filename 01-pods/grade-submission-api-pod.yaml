apiVersion: v1
kind: Pod
metadata:
  name: grade-submission-api
  labels:
    app.kubernetes.io/name: grade-submission
    app.kubernetes.io/components: backend  ## component within the application
    app.kubernetes.io/instance: grade-submission-api  ## specific instance of the application
spec:
  containers:
  - name: grade-submission-api
    image: rslim087/kubernetes-course-grade-submission-api:stateless
    resources:
      requests:
        memory: "128Mi"
        cpu: "128m"
      limits:
        memory: "128Mi"
    ports:
      - containerPort: 3000
  - name: grade-submission-portal-health-checker
    image: rslim087/kubernetes-course-grade-submission-api-health-checker  ## Container image
    resources:
      requests:  ## minimum resources required
        memory: "128Mi"
        cpu: "200m"
      limits:
        memory: "128Mi"
        # cpu: "500m" Best practice: Do not set CPU limit, handled by linux kernel
